name: survival_node_mobile
description: Sovereign offline-first technical knowledge library with an enforced air gap.
publish_to: none
version: 1.0.0+6

environment:
  sdk: ">=3.10.0 <4.0.0"
  flutter: ">=3.38.0"

dependencies:
  flutter:
    sdk: flutter
  # Stage A: downloads + integrity
  background_downloader: ^9.6.0
  crypto: ^3.0.6
  path_provider: ^2.1.5
  path: ^1.9.0
  # Search + documents
  sqlite3: ^3.0.0            # bundles SQLite (FTS5 enabled) via build hooks; no *_flutter_libs needed
  pdfrx: ^2.11.0             # PDFium: rendering + text extraction on iOS and Android
  # RAG
  onnxruntime: ^1.4.1        # ONNX Runtime Mobile (pub package name "onnxruntime")
  ffi: ^2.1.3
  # Air-gap monitoring
  connectivity_plus: ^7.0.0
  flutter_blue_plus: ^2.0.0  # adapter on/off state only; never scans
  # Viewers
  shelf: ^1.4.2
  shelf_router: ^1.1.4
  webview_flutter: ^4.10.0
  maplibre_gl: ^0.28.0
  local_auth: ^3.0.2
  flutter_secure_storage: ^11.2.0
  cryptography: ^2.9.0
  image_picker: ^1.2.4
  geolocator: ^14.1.2
  url_launcher: ^6.3.1        # opens a YouTube link in the YouTube app or browser (Videos tab)
  file_picker: ^13.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

# Optional: encrypt library.db at rest (SQLCipher). Uncomment, then pass a key in FtsIndex.open().
# hooks:
#   user_defines:
#     sqlite3:
#       source: sqlcipher

flutter:
  uses-material-design: true
  assets:
    - assets/catalog/categories.json
    - assets/catalog/videos.json
    - assets/maps/style.json
    - assets/home/
    - assets/library/
    - assets/plants/
    - assets/tour/
    - assets/maps/fonts/Noto Sans Regular/
